[project]
name = "claude-monitor"
version = "0.1.0"
description = "Local dashboard of running Claude Code sessions: activity, scheduled jobs, stop / restart."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["flask>=3"]

[project.scripts]
claude-monitor = "claude_monitor.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
